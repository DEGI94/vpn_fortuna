name: Update VPN subscriptions
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect.py
      - test_collect.py
      - sources.txt
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser
        run: python -m unittest -v
      - name: Collect subscriptions
        run: python collect.py
      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptions .source-cache
          if ! git diff --cached --quiet; then
            git commit -m 'Update subscriptions'
            git push
          fi
      - name: Publish downloadable TXT files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view downloads >/dev/null 2>&1; then
            gh release create downloads --target main --title 'VPN Fortuna — TXT downloads' --notes 'Downloadable configuration lists, refreshed every four hours.'
          fi
          cp subscriptions/all.txt vpn_fortuna.txt
          cp subscriptions/v2rayng-test.txt vpn_fortuna_100.txt
          gh release upload downloads vpn_fortuna.txt vpn_fortuna_100.txt --clobber
